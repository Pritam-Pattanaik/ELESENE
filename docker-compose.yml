version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: elesene_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elesene
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: elesene_server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=elesene
      - JWT_SECRET=elesene_super_secret_production_key
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: elesene_client
    ports:
      - "5173:80" # Map 80 inside container to 5173 to match local dev flow
    depends_on:
      - server

volumes:
  pgdata:
